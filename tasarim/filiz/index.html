<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yolculuk deneme</title>
<style>
  :root { --kagit:#FFF7EE; --murekkep:#4B2E5E; --mor:#9A4DFF; --ikincil:#7A6A86; --yesil:#3FA34D; --kirmizi:#E5484D; }
  * { box-sizing:border-box; }
  body { margin:0; background:#EFE7F7; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--murekkep);
    display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .telefon { width:390px; height:844px; max-width:100vw; max-height:100vh; background:var(--kagit); border-radius:36px; overflow:hidden;
    box-shadow:0 20px 60px rgba(75,46,94,.25); display:flex; flex-direction:column; position:relative; }
  @media (max-width:430px) { .telefon { border-radius:0; height:100vh; } body { align-items:stretch; } }
  header { padding:52px 20px 10px; }
  .ust { display:flex; align-items:center; gap:10px; font:700 15px system-ui; }
  .rozet { background:#B5FF3D; border:2px solid var(--murekkep); border-radius:10px; padding:3px 9px; font-size:13px; }
  .ilerleme { margin-top:12px; height:8px; border-radius:6px; background:#E9DDF3; overflow:hidden; }
  .ilerleme i { display:block; height:100%; background:var(--mor); border-radius:6px; transition:width .3s; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 18px; gap:16px; }
  .sahne svg { width:100%; height:auto; display:block; border-radius:22px; }
  .dinle { align-self:center; display:flex; align-items:center; gap:8px; border:2px solid var(--murekkep); background:#fff; border-radius:999px;
    padding:10px 18px; font:600 15px system-ui; color:var(--murekkep); cursor:pointer; }
  .dinle.caliyor { background:#F0E6FF; }
  .secenekler { display:grid; gap:10px; }
  .secenekler button { border:3px solid transparent; border-radius:20px; padding:0; background:none; cursor:pointer; transition:transform .15s; }
  .secenekler button svg { width:100%; height:auto; display:block; border-radius:16px; }
  .secenekler button.dogru { border-color:var(--yesil); }
  .secenekler button.yanlis { border-color:var(--kirmizi); animation:salla .3s; opacity:.55; }
  @keyframes salla { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .yonerge { text-align:center; font:500 14px system-ui; color:var(--ikincil); margin:0; }
  footer { display:flex; gap:12px; padding:14px 20px 34px; }
  footer button { flex:1; height:56px; border-radius:18px; border:2px solid var(--murekkep); font:700 17px system-ui; cursor:pointer; }
  .geri { flex:0 0 64px; background:#fff; color:var(--murekkep); }
  .ileri { background:var(--mor); color:#fff; }
  .ileri:disabled { opacity:.35; cursor:default; }
  .giris { text-align:center; padding:0 10px; }
  .giris h1 { font:700 30px/1.15 system-ui; margin:0 0 12px; }
  .giris p { font:400 16px/1.5 system-ui; color:var(--ikincil); margin:0 0 10px; }
  .kanat { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .kanat div { border:2px solid var(--murekkep); border-radius:16px; padding:12px; font:500 13px/1.4 system-ui; background:#fff; }
  .kanat b { display:block; font-size:15px; margin-bottom:4px; }
  .kanat .tamam { background:#EEFFDD; }
  .sozcukler { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .sozcukler button { border:2px solid var(--murekkep); background:#FFE94D; border-radius:14px; padding:10px 16px; font:700 22px system-ui; color:var(--murekkep); cursor:pointer; }
  .baglanti { color:var(--ikincil); text-decoration:underline; }
  .secim { display:grid; gap:12px; }
  .secim button { height:56px; border-radius:18px; border:2px solid var(--murekkep); font:700 17px system-ui; cursor:pointer; }
  .secim .ileri { background:var(--mor); color:#fff; }
  .secim .ikincil { background:#fff; color:var(--murekkep); }
  .geri:disabled { opacity:.35; cursor:default; }
  .sozcukler button { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .rz { font:600 11px system-ui; padding:1px 7px; border-radius:8px; background:#EFE7F7; color:var(--ikincil); }
  .rz.duyum, .rz.kural, .rz.tam { background:#EEFFDD; color:#2D7A38; }
  .not { font:400 12px/1.5 system-ui; color:var(--ikincil); text-align:center; margin:0; }
  /* Gömülü kip (?gom=1): iDil tanıtım uygulamasının içinde iframe; telefon çerçevesi ve üst boşluk yok (uygulamanın kabuğu var). */
  .gom body { background:var(--kagit); display:block; min-height:0; }
  .gom .telefon { width:100%; height:100vh; max-width:none; max-height:none; border-radius:0; box-shadow:none; }
  .gom header { padding-top:10px; }
  .gom .ust .rozet { display:none; }
  .gom footer { padding-bottom:16px; }
  .gom main { min-height:0; justify-content:flex-start; justify-content:safe center; padding-top:8px; overflow-y:auto; }
</style>
<script>if (/[?&]gom=1/.test(location.search) && window.parent !== window) document.documentElement.classList.add('gom');</script>
</head>
<body>
<div class="telefon">
  <header>
    <div class="ust"><span class="rozet">Yolculuk</span><span id="baslik">Yolculuk deneme</span></div>
    <div class="ilerleme"><i id="cubuk" style="width:0"></i></div>
  </header>
  <main id="govde"></main>
  <footer id="alt"></footer>
</div>
<script type="module" src="oynatici.js"></script>
</body>
</html>
